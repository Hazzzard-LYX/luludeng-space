<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Only for Us｜LuLu & DengDeng</title><link rel="stylesheet" href="pages.css"></head>
<body class="login-page"><script>if(location.protocol==="file:"){location.replace(`http://127.0.0.1:4173/login.html${location.search}`)}</script><main class="login-shell">
  <section class="login-photo" aria-label="我们的花束照片"><img src="assets/登录封面.jpg" alt="白色花束"><div class="photo-shade"></div><div class="photo-caption"><span>OUR PRIVATE UNIVERSE</span><p></p></div></section>
  <section class="login-panel"><a class="login-logo" href="login.html">Lulu <b>&amp;</b> DengDeng</a><div class="login-form-wrap"><span class="login-kicker"></span><h1>欢迎来到<br><span class="login-world">噜噜和噔噔的世界</span></h1>
    <form id="login-form" novalidate><label for="password">PASSWORD</label><div class="password-row"><input id="password" name="password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" pattern="[0-9]{8}" placeholder="••••••••" aria-describedby="password-hint" required><button type="submit" aria-label="进入网站">→</button></div><p class="password-hint" id="password-hint">提示：照片的时间 <span>格式示例 19891109</span></p><p class="login-error" id="login-error" role="alert" aria-live="polite"></p></form>
  </div><small class="login-foot">ONLY LULU &amp; DENGDENG · 2026</small></section>
</main><script>
const expectedHash="6f0fe4cbb1d1e6f1fef684b38b27f6cbf4964026d714fdd04f594983e9d0f9e5",form=document.getElementById("login-form"),input=document.getElementById("password"),error=document.getElementById("login-error");
async function sha256(value){const data=new TextEncoder().encode(value),digest=await crypto.subtle.digest("SHA-256",data);return Array.from(new Uint8Array(digest)).map(byte=>byte.toString(16).padStart(2,"0")).join("")}
form.addEventListener("submit",async event=>{event.preventDefault();const value=input.value.trim();if(!/^\d{8}$/.test(value)){error.textContent="请输入 8 位日期数字";input.focus();return}if(await sha256(value)!==expectedHash){error.textContent="日期不对，再想想这束花是什么时候出现的？";input.value="";input.classList.add("shake");setTimeout(()=>input.classList.remove("shake"),450);input.focus();return}sessionStorage.setItem("lulu-dengdeng-auth","granted");const next=new URLSearchParams(location.search).get("next");location.replace(next&&/^[\w-]+\.html$/.test(next)?next:"index.html")});
</script></body></html>
