<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Only for Us｜LuLu & DengDeng</title><link rel="stylesheet" href="pages.css"></head>
<body class="login-page"><script>if(location.protocol==="file:"){location.replace(`http://127.0.0.1:4173/login.html${location.search}`)}</script><main class="login-shell">
  <section class="login-photo" aria-label="我们的花束照片"><img src="assets/登录封面.jpg" alt="白色花束"><div class="photo-shade"></div><div class="photo-caption"><span>OUR PRIVATE UNIVERSE</span><p></p></div></section>
  <section class="login-panel"><a class="login-logo" href="login.html">Lulu <b>&amp;</b> DengDeng</a><div class="login-form-wrap"><span class="login-kicker"></span><h1>欢迎来到<br><span class="login-world">噜噜和噔噔的世界</span></h1>
    <div id="login-form"><label for="login-button">EMAIL LOGIN</label><button id="login-button" class="login-access-button" type="button" disabled><span>用邮箱验证码登录</span><b aria-hidden="true">→</b></button><p class="password-hint" id="login-hint">正在确认身份…</p><p class="login-error" id="login-error" role="alert" aria-live="polite"></p></div>
  </div><small class="login-foot">ONLY LULU &amp; DENGDENG · 2026</small></section>
</main><script src="api.js?v=20261125a"></script><script>
const api=window.LULU_API,button=document.getElementById("login-button"),hint=document.getElementById("login-hint"),error=document.getElementById("login-error"),params=new URLSearchParams(location.search);
const requested=params.get("next")||"",next=/^[\w-]+\.html(\?[^#]*)?$/.test(requested)?requested:"index.html";
function enter(){try{sessionStorage.setItem(api.AUTH_KEY,"granted")}catch(storageError){error.textContent="浏览器阻止了登录状态，请关闭无痕模式后重试";return}location.replace(next)}
async function start(){if(await api.checkSession())return enter();button.disabled=false;hint.textContent="只有噜噜和噔噔的邮箱能收到验证码。";if(params.get("attempt")==="1")error.textContent="还没有登录成功。如果已经输入了验证码，请确认浏览器没有阻止 Cookie，再试一次。"}
button.addEventListener("click",()=>{const back=new URL(location.href);back.searchParams.set("attempt","1");button.disabled=true;hint.textContent="正在前往登录页…";location.href=api.loginUrl(back.href)});
start();
</script></body></html>
